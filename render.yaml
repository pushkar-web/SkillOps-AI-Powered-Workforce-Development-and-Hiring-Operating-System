# ============================================================
# render.yaml — Render Blueprint (Infrastructure as Code)
# SkillOps AI-Powered Workforce Development & Hiring OS
# ============================================================
# Deploy via: https://render.com/deploy  →  paste repo URL
# Or connect your GitHub repo and Render auto-detects this file
# ============================================================

databases:
  - name: skillops-db
    plan: free                    # Use 'starter' or 'standard' for production
    databaseName: skillops
    user: skillops_user
    region: oregon                # Change to your preferred region
    postgresMajorVersion: "15"

services:
  - type: web
    name: skillops-api
    runtime: docker
    plan: free                    # Use 'starter' or 'standard' for production
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # ── Database Connection (auto-linked from Render PostgreSQL) ──
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: skillops-db
          property: connectionString
          # Render provides: postgres://user:pass@host:port/db
          # We need:         jdbc:postgresql://host:port/db
          # The render-db-url.sh script handles conversion

      - key: DATABASE_URL
        fromDatabase:
          name: skillops-db
          property: connectionString

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: skillops-db
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: skillops-db
          property: password

      # ── JPA / Hibernate ──
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none

      - key: SPRING_JPA_SHOW_SQL
        value: "false"

      # ── Logging (reduce verbosity in production) ──
      - key: LOGGING_LEVEL_ROOT
        value: WARN

      - key: LOGGING_LEVEL_COM_SKILLOPS
        value: INFO

      - key: LOGGING_LEVEL_ORG_HIBERNATE_SQL
        value: WARN

      # ── Java / JVM ──
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

